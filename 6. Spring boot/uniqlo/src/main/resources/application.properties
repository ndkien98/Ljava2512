spring.application.name=uniqlo
# set port 8082
server.port=8082
# DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/uniqlo_education?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Thymeleaf config (optional, spring boot defaults are often fine but good practice to explicitly disable cache for dev)
spring.thymeleaf.cache=false

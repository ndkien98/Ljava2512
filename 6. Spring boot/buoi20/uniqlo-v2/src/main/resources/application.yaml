spring:
  application:
    name: uniqlo-v2

  # ── DataSource (MySQL) ──
  datasource:
    url: jdbc:mysql://localhost:3306/uniqlo_education?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # ── JPA / Hibernate ORM ──
  jpa:
    hibernate:
      ddl-auto: validate        # Chỉ validate schema, không tự tạo/xoá bảng
    show-sql: true              # log SQL ra console
    properties:
      hibernate:
        format_sql: true        # SQL đẹp, có indent
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Thymeleaf ──
  thymeleaf:
    cache: false                # Tắt cache để hot-reload khi dev

server:
  port: 8081
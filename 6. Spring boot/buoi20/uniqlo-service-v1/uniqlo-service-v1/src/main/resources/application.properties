spring.application.name=uniqlo-service-v1

# config k?t n?i database => t? ??ng spring s? ??c cï¿½c config vï¿½ t?o bean DataSource ?? k?t n?i ??n database,
# khï¿½ng c?n ph?i t?o file config, cï¿½ t? t? config b?ng class nh? spring mvc ho?c cï¿½ th? config
# 1 service spring boot connect ??n 2 ho?c nhi?u database, ch? c?n t?o config b?ng class cho cï¿½c datasource,
# m?i 1 object datasource chï¿½nh lï¿½ dï¿½nh cho 1 database
spring.datasource.url=jdbc:mysql://localhost:3306/uniqlo_education?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# config hikari connection pool
# max so luong cac pool ma service có
spring.datasource.hikari.maximum-pool-size=30 
# thời gian connection timeout khi sử dụng
spring.datasource.hikari.connection-timeout=30000
# thoi gian ton tai trong trạng thái idle chờ việc từ các thread khác
spring.datasource.hikari.idle-timeout=600000
# thời gian tối data connection có thể sống
spring.datasource.hikari.max-lifetime=1800000

# config JPA
# config chỉ định tạo update/tạo mới table trong db dưa vào entity, lưu ý chỉ bật update, create trong quá trình tìm hiểm hoặc demo, trong thực tế config này sẽ none để không thay đổi cấu trúc db từ service
spring.jpa.hibernate.ddl-auto=update
# show ra sql trong orm khi thuc hiện, có thể để để để debug để biệt thức tế query được to ra
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Allow SessionFactory.getCurrentSession() with Spring-managed transactions
spring.jpa.properties.hibernate.current_session_context_class=thread

# Storage configuration
storage.upload-dir=files/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

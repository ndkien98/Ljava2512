input {
  file {
    path => [
      "/log/user-service/application.log",
      "/log/product-service/application.log",
      "/log/master-data-service/application.log",
      "/log/order-service/application.log",
      "/log/eureka-server/application.log",
      "/log/eureka-gateway/application.log",
      "/log/config-server/application.log"
    ]
    codec => plain {
      charset => "UTF-8"
    }
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    stat_interval => "1 second"
    discover_interval => 5
    tags => ["microservice"]
  }
}

filter {
  # ──────────────────────────────────────────────
  # Bước 1: Parse JSON log (Log mới dạng JSON từ Logback)
  # ──────────────────────────────────────────────
  json {
    source => "message"
    target => "parsed"
    tag_on_failure => ["_plain_text_log"]
  }

  if "_plain_text_log" not in [tags] {
    # JSON log thành công -> Trích xuất trực tiếp service_name từ app
    if [parsed][service_name] {
      mutate { add_field => { "service_name" => "%{[parsed][service_name]}" } }
    }

    mutate {
      rename => {
        "[parsed][timestamp]"    => "timestamp"
        "[parsed][level]"        => "level"
        "[parsed][logger_name]"  => "logger_name"
        "[parsed][thread_name]"  => "thread_name"
        "[parsed][message]"      => "log_message"
        "[parsed][stack_trace]"  => "stack_trace"
      }
      remove_field => ["parsed", "message"]
      add_field => { "log_format" => "json" }
    }

    if [log_message] {
      mutate { rename => { "log_message" => "message" } }
    }

    if [timestamp] {
      date {
        match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "ISO8601"]
        target => "@timestamp"
        remove_field => ["timestamp"]
      }
    }
  } else {
    # Plain text log cũ (hoặc log thô của container) -> Dùng Grok trích xuất service_name từ đường dẫn file
    # Thử check cả [log][file][path] và path cũ
    if [log][file][path] {
      grok {
        match => { "[log][file][path]" => "/log/(?<extracted_svc>[^/]+)/application" }
        tag_on_failure => []
      }
    } else if [path] {
      grok {
        match => { "path" => "/log/(?<extracted_svc>[^/]+)/application" }
        tag_on_failure => []
      }
    }

    if [extracted_svc] {
      mutate { add_field => { "service_name" => "%{extracted_svc}" } }
    }

    # Parse log plain text
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:thread_name}\] %{LOGLEVEL:level}\s+\[%{DATA:extracted_svc_plain}\]\s+%{DATA:logger_name} - %{GREEDYDATA:log_body}"
      }
      tag_on_failure => []
    }
    # Pattern fallback nếu không có [service_name] trong log body
    if "_grokparsefailure" in [tags] {
      grok {
        match => {
          "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:thread_name}\] %{LOGLEVEL:level}\s+%{DATA:logger_name} - %{GREEDYDATA:log_body}"
        }
        tag_on_failure => []
      }
    }

    if [log_body] {
      mutate { rename => { "log_body" => "message" } }
    }
    if [log_timestamp] {
      date {
        match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss"]
        target => "@timestamp"
        remove_field => ["log_timestamp"]
      }
    }
    mutate { add_field => { "log_format" => "plaintext" } }
    # Xóa tag jsonparsefailure / grokparsefailure nếu có
    mutate { remove_tag => ["_jsonparsefailure", "_grokparsefailure"] }
  }

  # ──────────────────────────────────────────────
  # Bước 2: Dự phòng nếu vẫn không có service_name
  # ──────────────────────────────────────────────
  if ![service_name] or [service_name] == "" {
    mutate { add_field => { "service_name" => "unknown" } }
  }

  # ──────────────────────────────────────────────
  # Bước 3: Dọn dẹp các field metadata thừa
  # ──────────────────────────────────────────────
  mutate {
    add_field => { "environment" => "docker" }
    remove_field => ["agent", "ecs", "input", "host", "log", "event", "extracted_svc", "extracted_svc_plain", "path"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservice-logs-%{service_name}-%{+YYYY.MM.dd}"
    action => "index"
  }
}

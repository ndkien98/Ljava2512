server:
  port: 8081

spring:
  application:
    # Tên này dùng để đăng ký với Eureka và để các service khác gọi qua lb://USER-SERVICE
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/uniqlo_education?useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none   # Không tự động tạo/sửa bảng – dùng database.sql có sẵn
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# Đăng ký service với Eureka Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/   # Địa chỉ Eureka Server (gateway)
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT config – phải giống với eureka-gateway
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  access-token-expiration: 86400000    # 1 ngày (ms)
  refresh-token-expiration: 604800000  # 7 ngày (ms)

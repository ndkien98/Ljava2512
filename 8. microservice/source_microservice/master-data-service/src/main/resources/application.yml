server:
  port: 8083

spring:
  application:
    name: master-data-service
  datasource:
    url: jdbc:mysql://localhost:3306/uniqlo_education?useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19089/eureka/ # config đăng ký service này với eureka registry ở địa chỉ nào, ở đây là localhost cổng 19089
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port} # config instance id của service này, thường là tên service + port

server:
  port: 19089

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:19089/eureka/ # config đăng ký chính servie này với chính nó 
  server:
    wait-time-in-ms-when-sync-empty: 0

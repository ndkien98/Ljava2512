<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ══════════════════════════════════════════════════════════════════
     FRAGMENT: head - Common CSS includes
     Usage: <head th:replace="~{fragments/cms_layout :: head(title='Page Title')}">
     ══════════════════════════════════════════════════════════════════ -->
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'Uniqlo CMS — ' + ${title}">Uniqlo CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/cms/cms.css}"/>
</head>

<!-- ══════════════════════════════════════════════════════════════════
     FRAGMENT: sidebar - CMS Sidebar Navigation
     Usage: <aside th:replace="~{fragments/cms_layout :: sidebar(activePage='dashboard')}">
     activePage values: dashboard, users, categories, products, skus, reviews, visit-stats
     ══════════════════════════════════════════════════════════════════ -->
<aside class="sidebar" th:fragment="sidebar(activePage)">
  <div class="sidebar-logo">
    <div class="logo-text">UNIQLO<em>.</em>CMS</div>
    <div class="logo-badge"><i class="bi bi-database"></i> uniqlo_education</div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-avatar">A</div>
    <div class="sidebar-user-info">
      <div class="name" th:text="${#authentication?.name ?: 'Admin Uniqlo'}">Admin Uniqlo</div>
      <div class="role">ADMIN</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Menu chính</div>
    <a th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-item" th:href="@{/cms}"><i class="bi bi-grid-1x2-fill nav-icon"></i> Dashboard</a>
    <a th:classappend="${activePage == 'users'} ? 'active'" class="nav-item" th:href="@{/users}"><i class="bi bi-people-fill nav-icon"></i> Người dùng</a>
    <div class="nav-section-label" style="margin-top:16px;">Sản phẩm</div>
    <a th:classappend="${activePage == 'categories'} ? 'active'" class="nav-item" th:href="@{/cms/categories}"><i class="bi bi-diagram-3-fill nav-icon"></i> Danh mục</a>
    <a th:classappend="${activePage == 'products'} ? 'active'" class="nav-item" th:href="@{/cms/products}"><i class="bi bi-bag-fill nav-icon"></i> Sản phẩm</a>
    <a th:classappend="${activePage == 'skus'} ? 'active'" class="nav-item" th:href="@{/cms/skus}"><i class="bi bi-upc-scan nav-icon"></i> SKUs</a>
    <a th:classappend="${activePage == 'reviews'} ? 'active'" class="nav-item" th:href="@{/cms/reviews}"><i class="bi bi-chat-quote-fill nav-icon"></i> Đánh giá</a>
    <div class="nav-section-label" style="margin-top:16px;">Thống kê</div>
    <a th:classappend="${activePage == 'visit-stats'} ? 'active'" class="nav-item" th:href="@{/cms/visit-stats}"><i class="bi bi-graph-up-arrow nav-icon"></i> Visit Stats</a>
    <div class="nav-section-label" style="margin-top:16px;">Điều hướng</div>
    <a class="nav-item" th:href="@{/}"><i class="bi bi-house-fill nav-icon"></i> Trang chủ</a>
  </nav>
  <div class="sidebar-footer">
    <a class="btn-logout" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
  </div>
</aside>

<!-- ══════════════════════════════════════════════════════════════════
     FRAGMENT: topbar - CMS Top Bar with logout button
     Usage: <header th:replace="~{fragments/cms_layout :: topbar(title='Dashboard', subtitle='Xin chào')}">
     ══════════════════════════════════════════════════════════════════ -->
<header class="topbar" th:fragment="topbar(title, subtitle)">
  <div>
    <div class="topbar-title" th:text="${title}">Dashboard</div>
    <div class="topbar-sub" th:utext="${subtitle}">Subtitle</div>
  </div>
  <div class="topbar-right">
    <a class="btn-topbar" th:href="@{/cms}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="btn-topbar btn-topbar-logout" th:href="@{/logout}">
      <i class="bi bi-box-arrow-right"></i> Đăng xuất
    </a>
  </div>
</header>

<!-- ══════════════════════════════════════════════════════════════════
     FRAGMENT: footer-scripts - Common JS includes
     Usage: <div th:replace="~{fragments/cms_layout :: footer-scripts}"></div>
     ══════════════════════════════════════════════════════════════════ -->
<div th:fragment="footer-scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     FRAGMENT: flash-messages - Success/Error alert messages
     Usage: <div th:replace="~{fragments/cms_layout :: flash-messages}"></div>
     ══════════════════════════════════════════════════════════════════ -->
<div th:fragment="flash-messages">
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show fixed-top m-3" role="alert" style="z-index: 1050; max-width: 400px; margin-left: auto !important;">
    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show fixed-top m-3" role="alert" style="z-index: 1050; max-width: 400px; margin-left: auto !important;">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
</div>

</html>
